<!doctype html><meta charset="utf-8">
<style>body{background:#111;color:#eee;font:17px/1.5 ui-monospace,monospace;margin:0;padding:12px}
iframe{border:1px solid #444;width:880px;height:260px}</style>
<pre id="out">starting…</pre>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const out = document.getElementById("out"), f = document.getElementById("f");
localStorage.setItem("festa-disfresses:admin-key", q.get("k") || "");
f.src = "/admin";
let n = 0;
const tick = () => {
  n++;
  const d = f.contentDocument;
  const pw = d && d.querySelector('input[type=password]');
  const dash = d && d.querySelector("table");
  const h = d && d.querySelector("h1");
  out.textContent =
    "poll #" + n +
    "\nstored key   : " + (localStorage.getItem("festa-disfresses:admin-key") ? "present" : "MISSING") +
    "\nkey form     : " + (pw ? "showing (NOT auto-logged-in)" : "absent") +
    "\ndashboard    : " + (dash ? "RENDERED (auto-login worked)" : "not rendered") +
    "\nheading      : " + (h ? h.textContent : "-");
  if (n < 40) setTimeout(tick, 250);
};
setTimeout(tick, 300);
</script>
